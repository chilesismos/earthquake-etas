name: ETAS Chile Daily Forecast

on:
  schedule:
    - cron: "*/10 * * * *"
      timezone: "America/Sao_Paulo"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-etas:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Show current runner time
        run: |
          echo "UTC:"
          date -u
          echo "Runner time:"
          date

      - name: Run ETAS forecast
        run: |
          python etas_daily.py

      - name: Upload forecast outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etas-daily-output-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
